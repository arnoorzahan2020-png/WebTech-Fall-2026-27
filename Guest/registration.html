<!DOCTYPE html>
<html>
<head>
    <title>Registration - Event Board</title>

    <style>
        /* Plain HTML Form Style matching Login Page */
        body {
            font-family: Arial, Helvetica, sans-serif;
            font-size: 15px;
            color: #000;
            background-color: #fff;
            margin: 20px;
        }

        h1, h2 {
            color: #000;
        }

        /* Navbar */
        .navbar {
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid #ccc;
        }

        .navbar h1 {
            display: inline;
            font-size: 22px;
            margin: 0;
        }

        nav {
            float: right;
        }

        nav a {
            color: blue;
            text-decoration: underline;
            margin-left: 15px;
        }

        /* Fieldset Box Format */
        fieldset {
            margin: 20px auto;
            padding: 20px;
            border: 1px solid #999;
            max-width: 520px;
        }

        legend {
            font-weight: bold;
        }

        /* Form Row Layout */
        .form-row {
            margin-bottom: 12px;
        }

        .form-row label {
            display: inline-block;
            width: 150px;
            font-weight: bold;
            vertical-align: top;
        }

        .form-row input {
            padding: 5px;
            width: 300px;
        }

        .error {
            color: red;
            font-size: 12px;
            margin: 3px 0 0 154px;
        }

        /* Buttons & Links */
        .action-button {
            padding: 5px 15px;
            cursor: pointer;
        }

        .login-link {
            font-size: 13px;
            margin-top: 10px;
            text-align: center;
        }

        .login-link a {
            color: blue;
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <!-- Navigation Bar -->
    <header class="navbar">
        <h1>Event Board</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="login.html">Login</a>
            <a href="register.html">Register</a>
        </nav>
        <div style="clear: both;"></div>
    </header>


    <!-- Registration Container -->
    <div class="register-container">
        
        <form id="registerForm">
            <fieldset>
                <legend>CREATE STUDENT ACCOUNT</legend>

                <!-- Full Name -->
                <div class="form-row">
                    <label for="FullName">Full Name:</label>
                    <input type="text" id="FullName" placeholder="Full name">
                </div>
                <p id="NameError" class="error"></p>

                <!-- Phone Number -->
                <div class="form-row">
                    <label for="PhoneNumber">Phone Number:</label>
                    <input type="text" id="PhoneNumber" placeholder="Phone Number">
                </div>
                <p id="PhoneError" class="error"></p>

                <!-- Email -->
                <div class="form-row">
                    <label for="Email">Email:</label>
                    <input type="email" id="Email" placeholder="Email">
                </div>
                <p id="EmailError" class="error"></p>

                <!-- Password -->
                <div class="form-row">
                    <label for="Password">Password:</label>
                    <input type="password" id="Password" placeholder="Password">
                </div>
                <p id="PasswordError" class="error"></p>

                <!-- Confirm Password -->
                <div class="form-row">
                    <label for="ConfirmPassword">Confirm Password:</label>
                    <input type="password" id="ConfirmPassword" placeholder="Confirm password">
                </div>
                <p id="ConfirmError" class="error"></p>

                <!-- General Success/Error Message -->
                <p id="regMessage" class="error" style="margin-left: 0; text-align: center;"></p>

                <!-- Register Button -->
                <div class="form-row" style="text-align: center; margin-top: 15px; margin-bottom: 5px;">
                    <button type="submit" class="action-button">Register</button>
                </div>

                <!-- Login Link -->
                <div class="login-link">
                    Already have an account? <a href="login.html">Login here</a>
                </div>

            </fieldset>
        </form>

    </div>


    <!-- JavaScript Validation Logic -->
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const form = document.getElementById("registerForm");

            if (form) {
                form.addEventListener("submit", function (event) {
                    event.preventDefault();

                    if (collect_data()) {
                        let msg = document.getElementById("regMessage");
                        msg.style.color = "green";
                        msg.innerText = "Registration Successful!";
                    }
                });
            }
        });

        function collect_data() {
            let validName = validateName();
            let validPhone = validatePhone();
            let validEmail = validateEmail();
            let validPassword = validatePassword();
            let validConfirm = validateConfirmPassword();

            return validName && validPhone && validEmail && validPassword && validConfirm;
        }

        function validateName() {
            let name = document.getElementById("FullName").value.trim();
            let error = document.getElementById("NameError");

            if (name === "") {
                error.innerText = "Enter Your Name";
                return false;
            } else if (name.length < 6) {
                error.innerText = "Name Must be at least 6 Char";
                return false;
            } else {
                error.innerText = "";
                return true;
            }
        }

        function validatePhone() {
            let phone = document.getElementById("PhoneNumber").value.trim();
            let error = document.getElementById("PhoneError");
            let regexpression = /^01[3-9][0-9]{8}$/;

            if (phone === "") {
                error.innerText = "Please Enter Your Phone Number";
                return false;
            } else if (!regexpression.test(phone)) {
                error.innerText = "Please Enter a Valid Phone Number";
                return false;
            } else {
                error.innerText = "";
                return true;
            }
        }

        function validateEmail() {
            let email = document.getElementById("Email").value.trim();
            let error = document.getElementById("EmailError");
            let regexpression = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

            if (email === "") {
                error.innerText = "Please Enter The Email";
                return false;
            } else if (!regexpression.test(email)) {
                error.innerText = "Please Enter The Right Email Format";
                return false;
            } else {
                error.innerText = "";
                return true;
            }
        }

        function validatePassword() {
            let password = document.getElementById("Password").value;
            let error = document.getElementById("PasswordError");

            if (password === "") {
                error.innerText = "Please Enter Your Password";
                return false;
            } else if (password.length < 6) {
                error.innerText = "Password Must be at least 6 Char";
                return false;
            } else {
                error.innerText = "";
                return true;
            }
        }

        function validateConfirmPassword() {
            let password = document.getElementById("Password").value;
            let confirmPassword = document.getElementById("ConfirmPassword").value;
            let error = document.getElementById("ConfirmError");

            if (confirmPassword === "") {
                error.innerText = "Please Confirm Your Password";
                return false;
            } else if (password !== confirmPassword) {
                error.innerText = "Password Does Not Match";
                return false;
            } else {
                error.innerText = "";
                return true;
            }
        }
    </script>

</body>
</html>
