<!DOCTYPE html>
<html>
<head>
    <title>Login - Event Board</title>

    <style>
        /* Plain HTML Form Style matching Registration Page */
        body {
            font-family: Arial, Helvetica, sans-serif;
            font-size: 15px;
            color: #000;
            background-color: #fff;
            margin: 20px;
        }

        h1, h2 {
            color: #000;
        }

        /* Navbar */
        .navbar {
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid #ccc;
        }

        .navbar h1 {
            display: inline;
            font-size: 22px;
            margin: 0;
        }

        nav {
            float: right;
        }

        nav a {
            color: blue;
            text-decoration: underline;
            margin-left: 15px;
        }

        /* Fieldset Box Format */
        fieldset {
            margin: 20px auto;
            padding: 20px;
            border: 1px solid #999;
            max-width: 520px;
        }

        legend {
            font-weight: bold;
        }

        /* Form Row Layout */
        .form-row {
            margin-bottom: 12px;
        }

        .form-row label {
            display: inline-block;
            width: 130px;
            font-weight: bold;
            vertical-align: top;
        }

        .form-row input {
            padding: 5px;
            width: 280px;
        }

        .password-box {
            display: inline-block;
            width: 300px;
            vertical-align: top;
        }

        .password-box input {
            width: 205px;
        }

        .password-box button {
            padding: 5px 10px;
            cursor: pointer;
        }

        .error {
            color: red;
            font-size: 12px;
            margin: 3px 0 0 134px;
        }

        /* Buttons & Links */
        .login-button {
            padding: 5px 15px;
            cursor: pointer;
        }

        .register-link {
            font-size: 13px;
            margin-top: 10px;
            text-align: center;
        }

        .register-link a {
            color: blue;
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <!-- Navigation Bar -->
    <header class="navbar">
        <h1>Event Board</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="login.html">Login</a>
            <a href="register.html">Register</a>
        </nav>
        <div style="clear: both;"></div>
    </header>


    <!-- Login Container -->
    <div class="login-container">

        <form id="loginForm">
            <fieldset>
                <legend>LOGIN</legend>

                <!-- Email -->
                <div class="form-row">
                    <label for="loginEmail">Email:</label>
                    <input type="email" id="loginEmail" placeholder="Email">
                </div>
                <p id="emailError" class="error"></p>

                <!-- Password -->
                <div class="form-row">
                    <label for="loginPassword">Password:</label>
                    <div class="password-box">
                        <input type="password" id="loginPassword" placeholder="Password">
                        <button type="button" id="showPassword">Show</button>
                    </div>
                </div>
                <p id="passwordError" class="error"></p>

                <!-- General Error / Success Message -->
                <p id="loginError" class="error" style="margin-left: 0; text-align: center;"></p>

                <!-- Login Button -->
                <div class="form-row" style="text-align: center; margin-top: 15px; margin-bottom: 5px;">
                    <button type="submit" class="login-button">Login</button>
                </div>

                <!-- Register Link -->
                <div class="register-link">
                    No account? <a href="register.html">Register here</a>
                </div>

            </fieldset>
        </form>

    </div>


    <!-- JavaScript Logic -->
    <script>
        let loginForm = document.getElementById("loginForm");

        // Show / Hide Password
        let showPassword = document.getElementById("showPassword");
        showPassword.addEventListener("click", function() {
            let password = document.getElementById("loginPassword");
            if (password.type == "password") {
                password.type = "text";
                showPassword.innerHTML = "Hide";
            } else {
                password.type = "password";
                showPassword.innerHTML = "Show";
            }
        });

        // Login Validation
        loginForm.addEventListener("submit", function(event) {
            event.preventDefault();

            let email = document.getElementById("loginEmail").value.trim();
            let password = document.getElementById("loginPassword").value;

            let emailError = document.getElementById("emailError");
            let passwordError = document.getElementById("passwordError");
            let loginError = document.getElementById("loginError");

            emailError.innerHTML = "";
            passwordError.innerHTML = "";
            loginError.innerHTML = "";

            let valid = true;

            // Email Validation
            let regexpression = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (email == "") {
                emailError.innerHTML = "Please Enter The Email";
                valid = false;
            } else if (!regexpression.test(email)) {
                emailError.innerHTML = "Please Enter The Right Email Format";
                valid = false;
            }

            // Password Validation
            if (password == "") {
                passwordError.innerHTML = "Please enter your password.";
                valid = false;
            } else if (password.length < 6) {
                passwordError.innerHTML = "Password must contain at least 6 characters.";
                valid = false;
            }

            // Final Validation
            if (valid == true) {
                loginError.style.color = "green";
                loginError.innerHTML = "Login form validation successful!";
            }
        });
    </script>

</body>
</html>
