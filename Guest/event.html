
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Event Details</title>

    <link rel="stylesheet" href="../Demo3/event.css">
</head>

<body>

    <div class="container">

        <!-- Navbar -->
        <div class="navbar">

            <h2>Event Board</h2>

            <div class="navlinks">
                <a href="index.html">Home</a>
                <a href="login.html">Login</a>
                <a href="register.html">Register</a>
            </div>

        </div>

        <!-- Event Banner -->
        <div class="event-banner">
            <h2 id="eventTitle">EVENT BANNER</h2>
        </div>

        <!-- Event Information -->
        <div class="event-layout">

            <!-- Left Side: Event Details -->
            <div class="event-info">

                <p>Date: <span id="eventDate"></span></p>

                <p>Venue: <span id="eventVenue"></span></p>

                <p>Category: <span id="eventCategory"></span></p>

                <p>Description:</p>

                <p id="eventDescription"></p>

            </div>

            <!-- Right Side: Countdown and Seats -->
            <div class="event-side">

                <!-- Countdown -->
                <div class="countdown-box">
                    <h3>COUNTDOWN</h3>
                    <h3>Event Date: <span id="countdownDate"></span></h3>
                </div>

                <!-- Seat Counter -->
                <div class="seats-box">
                    <h3>SEATS <span id="registered"></span> /
                    <span id="totalSeats"></span></h3>
                </div>

                <!-- Login Button -->
                <a href="login.html">
                    <button type="button" class="loginButton">
                        Login to register
                    </button>
                </a>

            </div>

        </div>

    </div>

    <script src="../Demo3/event.js"></script>

</body>
</html>
