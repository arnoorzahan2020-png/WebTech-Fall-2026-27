<!DOCTYPE html>
<html>
<head>
    <title>Login - Event Board</title>
    <link rel="stylesheet" href="../Demo3/login.css">
</head>

<body>

    <!-- Navigation Bar -->

    <header class="navbar">

        <h1>Event Board</h1>

        <nav>
            <a href="index.html">Home</a>
            <a href="login.html">Login</a>
            <a href="register.html">Register</a>
        </nav>

    </header>


    <!-- Login Container -->

    <div class="login-container">

        <div class="login-box">

            <h2>LOGIN</h2>


            <!-- Login Form -->

            <form id="loginForm">

                <!-- Email -->

                <input
                    type="email"
                    id="loginEmail"
                    placeholder="Email"
                >

                <p id="emailError" class="error"></p>


                <!-- Password -->

                <div class="password-box">

                    <input
                        type="password"
                        id="loginPassword"
                        placeholder="Password"
                    >

                    <button
                        type="button"
                        id="showPassword"
                    >
                        Show
                    </button>

                </div>

                <p id="passwordError" class="error"></p>


                <!-- General Error -->

                <p id="loginError" class="error"></p>


                <!-- Register Link -->

                <p class="register-link">

                    No account?

                    <a href="register.html">Register here</a>

                </p>


                <!-- Login Button -->

                <button type="submit" class="login-button">
                    Login
                </button>

            </form>

        </div>

    </div>


    <!-- JavaScript -->

    <script src="../Demo3/login.js"></script>

</body>
</html>
